<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>PokèMatch</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.9.6/lottie.min.js"></script>
    
    <style>

        .varela-round-regular {
            font-family: "Varela Round", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        .center-text {
            text-align: center;
        } 
        
    
        body {
            margin: 0;
            font-family: "Varela Round", sans-serif;
            background-color: rgb(158, 15, 15);
            display:flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        button img {
            border: none;
            background: none;
            padding: 0;
        }

        button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.1, opacity 0.1;
            margin: 0 5px;
        }

        button:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        button:hover img {
            filter: brightness(0.9);
        }  
        
        .main-container{
            position:relative;
        }

        .main-layout{
            width: 100%;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .header-container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0;
            padding: 10px;
            max-width: 100%;
        }

        .logo img{
            width:100px;
            height:auto;
        }

        .pokemon-container{
            display:flex;
            position: relative;
            flex-direction:column;
            align-items: center;
            justify-content: flex-end;
            margin-top: 10px;
            height: 83.5vh;
            width: 33vw;
        }
        .pokemon-container .pokemon-image{
            position: relative;
            width: 100%;
            height: auto;
            max-width: 45vh;
            max-height: 50vh;
            border-radius: 2px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .pokemon-container .pokemon-nature{
            position: absolute;
            top: 10px;
            right:10px;
            width: 80px;
            height: auto;
            z-index: 2;
            pointer-events: none;
        }

        .nature-display-1, .nature-display-2, .nature-display-3 {
            display: inline-block;
            margin: auto; 
        }

        .nature-display-container {
            position: absolute;
            top: 10px; 
            right: 10px; 
            display: flex;
            gap: 4vw; 
        }

        .pokemon-name{
            font-weight: bold;
            font-size: 20px;
            color:black;
        }

        .pokemon-type{
            font-size: 16px;
            color:rgb(77, 77, 77);
        }

        .pokemon-info{
            font-size: 14px;
            color: #888;
            text-align:left;
            width: 92%;
            margin-bottom: 10px;
            padding:0 10px;
            margin-left: 30px;
            padding-right: 30px;
            justify-content: flex-end;
        }
        .like-dislike-buttons{
            display:flex;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
        }
        
        .profile-image{
            display: block;
            height: 15vh;
            width: auto;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            border: 2px solid #ddd;
            cursor: pointer;
        }

        .grid-container{
            display: grid;
            width: 30vw;
            background-color: white;
            border:1px solid #ccc;
            border-radius: 1.5%;
            cursor: pointer;
            padding: 4px;

        }
        .type-buttons{
            margin: 1px;
            padding: 2px;
            cursor: pointer;
        }

        .type-buttons.selected{
            transform: scale(1.1);
            filter: brightness(0.5);
        }

        .nature-buttons{
            margin: 1px;
            padding: 2px;
            cursor: pointer;
        }

        .nature-buttons.selected{
            transform: scale(1.1);
            filter: brightness(0.5);
        }

        .messages-profile{
            display: block;
            left:50%;
            top:0;
            height: 7.5vh;
            width: auto;
            border-radius: 50%;
            object-fit:cover;
            border: 2px solid #ddd;
            cursor: pointer;
        }
        /* MASON ADDED THIS FOR THE GENERATED ONES*/

        .pokemon-button-image {
            width: 7.5vh; /* Size should match the profile image size */
            height: 7.5vh; /* Square shape */
            border-radius: 50%; /* Circular shape */
            object-fit: cover; /* Ensures the image is cropped to fit the circle */
            border: 2px solid #ddd; /* Same border as the profile image */
            cursor: pointer; /* Clickable like a button */
            margin-right: 10px; /* Space between the image and text */
        }


        .pokemon-message-name{
            font-size: 0.8em;
            color:#000;
            margin:0;
        }
        
        .pokemon-type-nature{
            font-size: 0.9em;
            color:#2f2c30;
            margin:0;
        }

        #imageUpload {
            display: none;
        }
        
        #loginForm{
            align-items: center;
        }

        #createUserForm{
            display: none;
        }
        
        #passwordInputForm{
            display: none;
        }

        #messagesForm {
            position: absolute;
            right: 0.75vw;
            width: 31vw;
            height: 94.5vh;
            text-align: left;
            background-color: white;
            padding:5px;
            border: 1px solid #ddd;
            border-radius:10px;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        #innerMessagesForm{
            display: flex;
            flex-direction: row;
            gap:0.5vw;
        }

        #lottie {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 4; 
        }

        #loadingAnimation {
            position: absolute;
            display: none;
            opacity: 100%;
            max-width: 100vw; 
            max-height: auto; 
            background-color: white;
            z-index: 3; 
            display:flex;
            justify-items:flex-start;
            top:0;
            align-items: center;
            overflow:hidden;
        }

        #profileInputForm {
            position: absolute;
            right: 0.75vw;
            width: 31vw;
            height: 94.5vh;
            text-align: left;
            background-color: white;
            padding:5px;
            border: 1px solid #ddd;
            border-radius:10px;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        #profileForm {
            position: absolute;
            left: 0.95vw;
            width: 31vw;
            height: 94.5vh;
            text-align: left;
            background-color: white;
            padding:5px;
            border: 1px solid #ddd;
            border-radius:10px;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        #loggedinProfileForm {
            width: 100%;
            text-align: left;
            background-color: white;
            border-radius:10px;
            display: none;
        }

        #messagesForm input, #messagesForm textarea, #profileForm input, #profileForm textarea {
            width: 96%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        #profileForm button{
            padding-top:5px;
        }

        #messageProfileForm{
            width: 8vw;
            height: 93.25vh;
            background-color: #939aa1;
            border-radius: 5px;
            display:flex;
            flex-direction: column;
            align-items: center;
            padding:1%;
        }

        #activeMessageForm{
            background-color: #d9e0e6;
            border-radius: 5px;
            display:inline-block;
            width: 22vw;
            height: 93.25vh;
            padding: 1%;
        }

        #activeMessageFormInput{
            margin-top: 105.5%;
            width: 20.66vw;
        }

    </style>    
</head>

    <script src="renderer.js"></script>
    <script>
        const settingsButton = document.getElementById("settingsButton");
        const messagesForm = document.getElementById("messagesForm");
        const messagesButton = document.getElementById("messagesButton");
        const profileForm = document.getElementById("profileForm");
        const imageUpload = document.getElementById('imageUpload');
        const profileImage = document.getElementById('profileImage');
        const registerUserButton = document.getElementById('registerUserButton');
        const loginButton = document.getElementById('loginButton');
        const createUserForm = document.getElementById('createUserForm');
        const loggedinProfileForm = document.getElementById('loggedinProfileForm');
        const passwordInputForm = document.getElementById('passwordInputForm');
        const backButtonPassword = document.getElementById('backButtonPassword');
        const backButtonCreateUser = document.getElementById('backButtonCreateUser');
        const backButtonLoggedIn = document.getElementById('backButtonLoggedIn');
        const loginForm = document.getElementById('loginForm');
        const createUserButton = document.getElementById('createUserButton');
        const loginText = document.getElementById('loginText');
        const typeButtons = document.querySelectorAll('.type-buttons');
        const natureButtons = document.querySelectorAll('.nature-buttons');
        const loadingAnimationContainer = document.getElementById('loadingAnimation');
        const pokemonImage = document.querySelector('.pokemon-image');
        const pokemonName = document.getElementById('pokemonName')
        const pokemonType = document.getElementById('pokemonType')
        const pokemonAbility = document.getElementById('pokemonAbility')
        const natureDisplay1 = document.getElementById('nature-display-1');
        const natureDisplay2 = document.getElementById('nature-display-2');
        const natureDisplay3 = document.getElementById('nature-display-3');
        const likeButton = document.getElementById('likeButton');
        const dislikeButton = document.getElementById('dislikeButton');
        let typeSelectedCount = 0;
        const typeMaxSelections = 3;
        let natureSelectedCount = 0;
        const natureMaxSelections = 3;

        // Settings Button setup
        settingsButton.addEventListener("click", () => {
            // If profile is not showing, display. Else, remove display.
            if (profileForm.style.display === "none" || profileForm.style.display === "") {
                profileForm.style.display = "block";
            } else {
                profileForm.style.display = "none";
            }
        });

        // Messages Button Setup
        messagesButton.addEventListener("click", () => {
            // If temp input is not showing, display. Else, remove display.
            if (messagesForm.style.display === "none" || messagesForm.style.display === "") {
                messagesForm.style.display = "block";
            } else {
                messagesForm.style.display = "none";
            }
        });
    
        // Register Button Setup
        registerUserButton.addEventListener("click", () => {
            // If clicked, remove create user button & login button.
            // Then display the create user form in the profile container
            registerUserButton.style.display = "none";
            loginButton.style.display = "none";
            loginText.style.display = "none";
            createUserForm.style.display = "block";
        });

        // Login Button Setup
        loginButton.addEventListener("click", () => {
            // If clicked, remove create user button & login button.
            // Then display the password input form in the profile container
            registerUserButton.style.display = "none";
            loginButton.style.display = "none";
            loginText.style.display = "none";
            passwordInputForm.style.display = "block";
        });

        // Completed Login button Setup
        function loginComplete(){
            // If clicked, remove create user button & login button.
            // Then display the logged in profile form in the profile container
            populateUserInfo()
            passwordInputForm.style.display = "none";
            loggedinProfileForm.style.display = "block";
        }
        
        // Back Button Password Setup
        backButtonPassword.addEventListener("click", () => {
            passwordInputForm.style.display = "none";
            loginForm.style.display = "block";
            loginText.style.display = "block";
            loginButton.style.display = "inline";
            registerUserButton.style.display = "inline";
        });

        // Back Button Create User Setup
        backButtonCreateUser.addEventListener("click", () => {
            createUserForm.style.display = "none";
            loginForm.style.display = "block";
            loginText.style.display = "block";
            loginButton.style.display = "inline";
            registerUserButton.style.display = "inline";
        });

        // Back Button Logged In Setup
        backButtonLoggedIn.addEventListener("click", () => {
            loggedinProfileForm.style.display = "none";
            loginForm.style.display = "block";
            loginText.style.display = "block";
            loginButton.style.display = "inline";
            registerUserButton.style.display = "inline";
        });

        typeButtons.forEach(button =>{
            button.addEventListener('click',() => {
                if(button.classList.contains('selected')){
                    button.classList.remove('selected');
                    typeSelectedCount--;
                } else {
                    if (typeSelectedCount < typeMaxSelections){
                        button.classList.add('selected');
                        typeSelectedCount++;
                    } else {
                        alert('Max: 3');
                    }
                }
            });
        });
        
        natureButtons.forEach(button =>{
            button.addEventListener('click',() => {
                if(button.classList.contains('selected')){
                    button.classList.remove('selected');
                    natureSelectedCount--;
                } else {
                    if (natureSelectedCount < natureMaxSelections){
                        button.classList.add('selected');
                        natureSelectedCount++;
                    } else {
                        alert('Max: 3!');
                    }
                }
            });
        });

        window.animation = lottie.loadAnimation({
            container: document.getElementById('lottie'),
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: 'animations/match_animation.json'
        });

        const loadingAnimation = lottie.loadAnimation({
            container:document.getElementById('loadingAnimation'),
            renderer:'svg',
            loop: true,
            autoplay: true,
            path:'animations/loading.json'
        })

        function showLoadingAnimation(){
            loadingAnimationContainer.style.display  =  'block';
            pokemonImage.style.display = 'none';
            pokemonName.style.display = 'none';
            pokemonType.style.display = 'none';
            pokemonAbility.style.display = 'none';
            natureDisplay1.style.display = 'none';
            natureDisplay2.style.display = 'none';
            natureDisplay3.style.display = 'none';
            likeButton.style.display = 'none';
            dislikeButton.style.display = 'none';
            pokemonImage.alt='';
            loadingAnimation.play();
            loadingAnimation.setSpeed(2);
        }
        
        function hideLoadingAnimation(){
            loadingAnimationContainer.style.display = 'none';
            loadingAnimation.stop();
            pokemonImage.style.display = 'block';
            pokemonName.style.display = 'block'; 
            pokemonType.style.display = 'block';
            pokemonAbility.style.display = 'block';
            natureDisplay1.style.display = 'inline-block';
            natureDisplay2.style.display = 'inline-block';
            natureDisplay3.style.display = 'inline-block';
            likeButton.style.display = 'block';
            dislikeButton.style.display = 'block';
            pokemonImage.alt='Pokemon Image';
        }
    </script>
</body>
</html>
